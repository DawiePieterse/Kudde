# Alembic configuration for Kudde.
#
# Migrations are not normally run by hand: backend/migrate.py runs them at
# server startup. This file exists for the two cases where the `alembic`
# command line is the right tool - writing a new migration, and inspecting
# history:
#
#     cd backend
#     .venv/Scripts/python.exe -m alembic revision --autogenerate -m "what changed"
#     .venv/Scripts/python.exe -m alembic history
#
# script_location is relative, so those commands must be run from backend/.
# migrate.py overrides it with an absolute path, because a Scheduled Task
# starts the server from whatever directory Windows feels like.

[alembic]
script_location = migrations

# Date first so `ls versions/` reads in the order the migrations happened.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No sqlalchemy.url here, deliberately - migrations/env.py takes it from
# db.DATABASE_URL instead, so there is exactly one place that knows where a
# farm's database lives.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
